name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          # Errores de Java (archivo:línea: error: mensaje)
          grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's#^.*/(src/[^:]+):([0-9]+):.*#\1#')
            num=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+):.*#\1#')
            msg=$(echo "$line" | sed -E 's#^.*: error: ##')
            echo "::error file=$file,line=$num::$msg"
          done
          # Errores de Gradle ("What went wrong")
          grep -iE "deobf|mapped_official|Exception" build.log | grep -v "^\s*at " | head -15 | while IFS= read -r line; do
            echo "::error title=detalle::$line"
          done
          awk '/What went wrong/{f=1;n=0} f{print; n++} n>12{f=0}' build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=gradle::$line"
          done

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: draviti-mod
          path: build/libs/*.jar

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          # Errores de Java (archivo:línea: error: mensaje)
          grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's#^.*/(src/[^:]+):([0-9]+):.*#\1#')
            num=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+):.*#\1#')
            msg=$(echo "$line" | sed -E 's#^.*: error: ##')
            echo "::error file=$file,line=$num::$msg"
          done
          # Errores de Gradle ("What went wrong")
          grep -iE "deobf|mapped_official|Exception" build.log | grep -v "^\s*at " | head -15 | while IFS= read -r line; do
            echo "::error title=detalle::$line"
          done
          awk '/What went wrong/{f=1;n=0} f{print; n++} n>12{f=0}' build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=gradle::$line"
          done

      - name: Comprobar mixins en el .jar
        run: |
          rm -f build/libs/*-slim.jar
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          unzip -l "$jar" | grep -E "mixins.json|refmap.json|jarjar"
          unzip -p "$jar" draviti.refmap.json | grep -q "renderLevel" || { echo "::error::El refmap no tiene los mixins del núcleo de gravedad"; exit 1; }
          unzip -l "$jar" | grep -q "META-INF/jarjar/.*mixinextras" || { echo "::error::Falta MixinExtras dentro del .jar"; exit 1; }
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q "draviti.gravity.mixins.json" || { echo "::error::Falta MixinConfigs en el manifiesto"; exit 1; }
          echo "::notice::Mixins OK en $jar"

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: draviti-mod
          path: build/libs/*.jar

  # Arranca el juego de verdad y obliga a aplicar todos los mixins del núcleo de gravedad
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Servidor
        run: |
          chmod +x ./gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 1200 ./gradlew runServer --no-daemon \
            -Pdraviti_jvm="-Ddraviti.smoketest=true" 2>&1 | tee server.log || true
          grep -q "DRAVITI_SMOKE_OK" run/logs/latest.log server.log || { grep -E "DRAVITI_SMOKE|Mixin|Exception|ERROR" server.log | head -80; echo "::error::El servidor no pasó la prueba"; exit 1; }
          echo "::notice::$(grep -ho 'DRAVITI_SMOKE_OK.*' server.log run/logs/latest.log | head -1)"

      - name: Cliente (pantalla virtual)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          printf "onboardAccessibility:false\nnarrator:0\nsoundDevice:\"\"\n" > run/options.txt
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon \
            -Pdraviti_jvm="-Ddraviti.smoketest=true" 2>&1 | tee client.log || true
          grep -q "DRAVITI_SMOKE_OK" client.log run/logs/latest.log || {
            # Las líneas del fallo salen como anotaciones (se pueden leer sin descargar el log)
            cat client.log run/logs/latest.log run/crash-reports/*.txt 2>/dev/null \
              | grep -E "DRAVITI_SMOKE|Mixin.*(rror|ail)|Exception|Caused by|ERROR|FATAL|Description:|GLFW|OpenGL" \
              | grep -v "^\s*at " | awk '!seen[$0]++' | head -45 | cut -c1-900 \
              | while IFS= read -r l; do echo "::error title=cliente::$l"; done
            tail -25 client.log | while IFS= read -r l; do echo "::warning title=final::$l"; done
            echo "::error::El cliente no pasó la prueba"; exit 1; }
          echo "::notice::$(grep -ho 'DRAVITI_SMOKE_OK.*' client.log run/logs/latest.log | head -1)"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server.log
            client.log
            run/logs/
            run/crash-reports/

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lodestone"
    mandatory=true
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Opcional: si está instalado, D.raviti usa sus teclas y comparte su barra de habilidades (no hace falta para jugar)
[[dependencies.${mod_id}]]
    modId="cursedpowers"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Opcional: con Photon instalado los efectos son los de Photon (assets/draviti/fx); sin él, los de Lodestone
[[dependencies.${mod_id}]]
    modId="photon"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

# Opcional: con Epic Fight las capas del poder se dibujan sobre su modelo
[[dependencies.${mod_id}]]
    modId="epicfight"
    mandatory=false
    versionRange="[20.0,)"
    ordering="NONE"
    side="BOTH"

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// MixinExtras va dentro del .jar (lo necesita el núcleo de gravedad de Gravity Control)
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Necesario para que Player Animator y Lodestone (mixins) funcionen en desarrollo
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Prueba automática de GitHub (-Pdraviti_jvm="-Ddraviti.smoketest=true")
            if (project.findProperty('draviti_jvm')) jvmArgs project.findProperty('draviti_jvm').toString().split(' ')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixins del núcleo de gravedad (copiado de Gravity Control) para Gravity Swap
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.gravity.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared (Lodestone)"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "KosmX (Player Animator)"
        url = "https://maven.kosmx.dev/"
    }
    maven {
        name = "CurseMaven (Photon y LDLib, solo para probar)"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    // VFX y partículas
    implementation fg.deobf("team.lodestar.lodestone:lodestone:${lodestone_version}", { transitive = false })
    // Animaciones del jugador
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")

    // Photon (opcional): solo en runClient para ver sus efectos. No va dentro del .jar ni hace falta para jugar.
    // Para probar sin Photon pon dev_photon=false en gradle.properties.
    if (project.findProperty('dev_photon') == 'true') {
        runtimeOnly fg.deobf("curse.maven:photon-871522:${photon_file}")
        runtimeOnly fg.deobf("curse.maven:ldlib-626676:${ldlib_file}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

def applyModManifest(Jar t) {
    t.manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.gravity.mixins.json"
        ])
    }
}

// El .jar para jugar es el de jarJar (lleva MixinExtras dentro); el normal queda como "-slim"
tasks.named('jar', Jar).configure {
    applyModManifest(it)
    archiveClassifier = 'slim'
    finalizedBy 'reobfJar'
}
tasks.named('jarJar').configure {
    applyModManifest(it)
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}
reobf {
    jarJar { }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
